<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Partes de árbol</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{ --azul:#004270; --texto:#2C343A; --texto-suave:#656d7e; --fondo:#f2f2f5; --borde:#dde1e6; --verde:#2e7d4f; --sel:#e8a33d; }
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Segoe UI",Roboto,Arial,sans-serif;background:var(--fondo);color:var(--texto);}
  header{background:var(--azul);color:#f6f8fa;padding:12px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;}
  header h1{font-size:1.1rem;margin:0;}
  header .ayuda{color:#cfe3f2;font-size:.8rem;}
  .layout{display:flex;min-height:calc(100vh - 50px);}
  aside{width:300px;flex-shrink:0;border-right:1px solid var(--borde);background:#fafbfc;padding:12px;overflow-y:auto;max-height:calc(100vh - 50px);position:sticky;top:0;}
  aside input[type=search]{width:100%;padding:6px 8px;border:1px solid var(--borde);border-radius:6px;margin-bottom:6px;}
  aside label{font-size:.8rem;color:var(--texto-suave);display:block;margin-bottom:8px;}
  .esp{padding:6px 8px;border-radius:6px;cursor:pointer;font-size:.85rem;}
  .esp:hover{background:#e6edf4;}
  .esp.activa{background:#dce6f1;font-weight:600;}
  .esp .cien{font-style:italic;}
  .esp .sub{font-size:.72rem;color:var(--texto-suave);display:flex;gap:6px;align-items:center;}
  .puntos{display:inline-flex;gap:2px;}
  .puntos i{width:8px;height:8px;border-radius:50%;background:var(--borde);display:inline-block;}
  .puntos i.si{background:var(--verde);}
  main{flex:1;padding:16px 20px;min-width:0;}
  .cabecera h2{margin:0 0 4px;font-size:1.2rem;}
  .resumen{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 16px;}
  .chip{font-size:.78rem;padding:3px 9px;border-radius:12px;background:#e9ecef;color:var(--texto-suave);}
  .chip.si{background:#d6efe0;color:var(--verde);font-weight:600;}
  .grupo{background:#fff;border:1px solid var(--borde);border-radius:10px;padding:12px;margin-bottom:14px;}
  .grupo h3{margin:0 0 10px;font-size:.9rem;color:var(--texto-suave);font-weight:600;}
  .fotos{display:flex;gap:12px;flex-wrap:wrap;}
  .foto{width:220px;border:3px solid transparent;border-radius:8px;padding:4px;background:#f7f8fa;}
  .foto.sel{border-color:var(--sel);}
  .foto img{width:100%;height:200px;object-fit:cover;border-radius:5px;background:#e0e0e0;display:block;cursor:pointer;}
  .foto .id{font-size:.72rem;color:var(--texto-suave);margin:3px 0;display:flex;justify-content:space-between;}
  .foto .id a{color:inherit;}
  .botones{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;}
  .botones button{font-size:.7rem;padding:4px 2px;border:1px solid var(--borde);border-radius:4px;background:#fff;cursor:pointer;color:var(--texto);}
  .botones button.on{background:var(--azul);color:#f6f8fa;border-color:var(--azul);}
  .mas{margin-top:10px;font-size:.8rem;background:none;border:1px dashed var(--borde);border-radius:6px;padding:5px 10px;cursor:pointer;color:var(--azul);}
  .vacio{text-align:center;padding:60px 20px;color:var(--texto-suave);}
  @media (max-width:700px){ .layout{flex-direction:column;} aside{width:auto;max-height:40vh;position:static;} .foto{width:calc(50% - 6px);} .foto img{height:150px;} }
</style>
</head>
<body>
<header>
  <h1>Partes de árbol</h1>
  <span class="ayuda">Clic o ← → para elegir foto · 1 completo · 2 tronco · 3 hoja · 4 flor · 5 fruto · 6 otro · 0 borrar · clic en la imagen la abre grande</span>
</header>
<div class="layout">
  <aside>
    <input type="search" id="filtro" placeholder="Buscar especie…">
    <label><input type="checkbox" id="soloPendientes"> Solo con fotos sin etiquetar</label>
    <div id="lista">Cargando…</div>
  </aside>
  <main id="contenido"><div class="vacio">Elige una especie a la izquierda.</div></main>
</div>
<script>
"use strict";

var PARTES = [
  ["arbol_completo", "Completo"], ["tronco", "Tronco"], ["hoja", "Hoja"],
  ["flor", "Flor"], ["fruto", "Fruto"], ["otro", "Otro"]
];
var MOSTRAR_POR_GRUPO = 4;
var especies = [];
var actual = null;      // datos de la especie abierta
var seleccion = null;   // foto_id seleccionada

function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

function puntosHtml(partes) {
  // las 5 partes que pidió Maya; "otro" no cuenta
  return '<span class="puntos" title="completo, tronco, hoja, flor, fruto">' +
    PARTES.slice(0, 5).map(function (p) { return '<i class="' + (partes[p[0]] ? "si" : "") + '"></i>'; }).join("") +
    "</span>";
}

function pintarLista() {
  var txt = document.getElementById("filtro").value.toLowerCase();
  var soloPend = document.getElementById("soloPendientes").checked;
  var html = especies.filter(function (e) {
    if (soloPend && e.etiquetadas >= e.total) return false;
    return !txt || (e.nombre_cientifico + " " + (e.nombre_comun || "")).toLowerCase().indexOf(txt) >= 0;
  }).map(function (e) {
    return '<div class="esp' + (actual && actual.especie_id === e.especie_id ? " activa" : "") + '" data-id="' + e.especie_id + '">' +
      '<div class="cien">' + esc(e.nombre_cientifico) + "</div>" +
      '<div class="sub">' + esc(e.nombre_comun || "") + " · " + e.etiquetadas + "/" + e.total + " " + puntosHtml(e.partes) + "</div>" +
      "</div>";
  }).join("");
  document.getElementById("lista").innerHTML = html || '<div class="vacio">Nada coincide.</div>';
}

function cargarEspecies() {
  return fetch("/api/especies").then(function (r) { return r.json(); }).then(function (d) {
    especies = d;
    pintarLista();
  });
}

function fotoHtml(f) {
  return '<div class="foto' + (f.foto_id === seleccion ? " sel" : "") + '" data-foto="' + f.foto_id + '">' +
    (f.disponible
      ? '<img loading="lazy" src="/api/foto/' + f.foto_id + '/imagen" alt="Foto ' + f.foto_id + '">'
      : '<img alt="sin red ni espejo local">') +
    '<div class="id"><a href="http://localhost:8044/?id=' + f.foto_id + '" target="_blank">#' + f.foto_id + "</a>" +
      (f.disponible ? "" : "<span>sin red/espejo</span>") + "</div>" +
    '<div class="botones">' + PARTES.map(function (p, i) {
      return '<button data-parte="' + p[0] + '" class="' + (f.parte === p[0] ? "on" : "") + '" title="tecla ' + (i + 1) + '">' + p[1] + "</button>";
    }).join("") + "</div></div>";
}

function pintarEspecie() {
  var conteo = {};
  actual.grupos.forEach(function (g) { g.fotos.forEach(function (f) { if (f.parte) conteo[f.parte] = (conteo[f.parte] || 0) + 1; }); });
  var html = '<div class="cabecera"><h2><i>' + esc(actual.nombre_cientifico) + "</i></h2>" +
    '<div class="meta">' + esc(actual.nombre_comun || "") + "</div></div>" +
    '<div class="resumen">' + PARTES.map(function (p) {
      return '<span class="chip' + (conteo[p[0]] ? " si" : "") + '">' + p[1] + ": " + (conteo[p[0]] || 0) + "</span>";
    }).join("") + "</div>";
  actual.grupos.forEach(function (g, gi) {
    var visibles = g.expandido ? g.fotos : g.fotos.slice(0, MOSTRAR_POR_GRUPO);
    html += '<div class="grupo"><h3>' + (g.grupo_id === null ? "Sin grupo de espécimen" : "Grupo " + g.grupo_id) +
      " · " + g.fotos.length + " foto" + (g.fotos.length === 1 ? "" : "s") + "</h3>" +
      '<div class="fotos">' + visibles.map(fotoHtml).join("") + "</div>" +
      (g.fotos.length > visibles.length
        ? '<button class="mas" data-grupo="' + gi + '">Ver las ' + (g.fotos.length - visibles.length) + " restantes</button>" : "") +
      "</div>";
  });
  document.getElementById("contenido").innerHTML = html;
}

function abrirEspecie(id) {
  fetch("/api/especie/" + id).then(function (r) { return r.json(); }).then(function (d) {
    actual = d;
    seleccion = null;
    var url = new URL(window.location);
    url.searchParams.set("especie", id);
    window.history.replaceState({}, "", url);
    pintarEspecie();
    pintarLista();
    window.scrollTo(0, 0);
  });
}

function fotosVisibles() {
  var ids = [];
  document.querySelectorAll(".foto").forEach(function (el) { ids.push(parseInt(el.dataset.foto, 10)); });
  return ids;
}

function buscarFoto(id) {
  for (var i = 0; i < actual.grupos.length; i++) {
    for (var j = 0; j < actual.grupos[i].fotos.length; j++) {
      if (actual.grupos[i].fotos[j].foto_id === id) return actual.grupos[i].fotos[j];
    }
  }
  return null;
}

function seleccionar(id) {
  seleccion = id;
  document.querySelectorAll(".foto").forEach(function (el) {
    el.classList.toggle("sel", parseInt(el.dataset.foto, 10) === id);
  });
  var el = document.querySelector('.foto[data-foto="' + id + '"]');
  if (el) el.scrollIntoView({block: "nearest"});
}

function etiquetar(id, parte, avanzar) {
  var f = buscarFoto(id);
  if (!f) return;
  var nueva = (parte === f.parte) ? null : parte;  // repetir el mismo botón la quita
  fetch("/api/etiqueta", {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({foto_id: id, parte: nueva})
  }).then(function (r) {
    if (!r.ok) throw new Error("fallo");
    var antes = f.parte;
    f.parte = nueva;
    var e = especies.find(function (x) { return x.especie_id === actual.especie_id; });
    if (e) {
      if (antes) { e.partes[antes]--; if (!e.partes[antes]) delete e.partes[antes]; e.etiquetadas--; }
      if (nueva) { e.partes[nueva] = (e.partes[nueva] || 0) + 1; e.etiquetadas++; }
    }
    pintarEspecie();
    pintarLista();
    var ids = fotosVisibles();
    var siguiente = avanzar && nueva ? ids[ids.indexOf(id) + 1] : id;
    seleccionar(siguiente !== undefined ? siguiente : id);
  }).catch(function () { alert("No se pudo guardar la etiqueta de la foto #" + id); });
}

document.getElementById("lista").addEventListener("click", function (ev) {
  var el = ev.target.closest(".esp");
  if (el) abrirEspecie(parseInt(el.dataset.id, 10));
});
document.getElementById("filtro").addEventListener("input", pintarLista);
document.getElementById("soloPendientes").addEventListener("change", pintarLista);

document.getElementById("contenido").addEventListener("click", function (ev) {
  var mas = ev.target.closest(".mas");
  if (mas) { actual.grupos[parseInt(mas.dataset.grupo, 10)].expandido = true; pintarEspecie(); seleccionar(seleccion); return; }
  var tarjeta = ev.target.closest(".foto");
  if (!tarjeta) return;
  var id = parseInt(tarjeta.dataset.foto, 10);
  var boton = ev.target.closest("button[data-parte]");
  if (boton) { etiquetar(id, boton.dataset.parte, false); return; }
  if (ev.target.tagName === "IMG" && seleccion === id) { window.open("/api/foto/" + id + "/imagen?tam=1400", "_blank"); return; }
  seleccionar(id);
});

document.addEventListener("keydown", function (ev) {
  if (!actual || ev.target.tagName === "INPUT") return;
  var ids = fotosVisibles();
  if (ev.key === "ArrowRight" || ev.key === "ArrowLeft") {
    var i = seleccion === null ? -1 : ids.indexOf(seleccion);
    var j = ev.key === "ArrowRight" ? Math.min(i + 1, ids.length - 1) : Math.max(i - 1, 0);
    if (ids.length) seleccionar(ids[j]);
    ev.preventDefault();
    return;
  }
  if (seleccion === null) return;
  var n = parseInt(ev.key, 10);
  if (n >= 1 && n <= 6) etiquetar(seleccion, PARTES[n - 1][0], true);
  else if (n === 0 && buscarFoto(seleccion).parte) etiquetar(seleccion, buscarFoto(seleccion).parte, false);
});

cargarEspecies().then(function () {
  var inicial = new URL(window.location).searchParams.get("especie");
  if (inicial) abrirEspecie(parseInt(inicial, 10));
});
</script>
</body>
</html>
