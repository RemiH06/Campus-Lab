<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Clustering por espécimen</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{ --azul:#004270; --texto:#2C343A; --texto-suave:#656d7e; --fondo:#f2f2f5; --borde:#dde1e6; --verde:#1a7f4e; --amarillo:#a67c00; }
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Segoe UI",Roboto,Arial,sans-serif;background:var(--fondo);color:var(--texto);}
  header{background:var(--azul);color:#f6f8fa;padding:14px 24px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;}
  header h1{font-size:1.1rem;margin:0;white-space:nowrap;}
  header select{padding:6px 10px;border-radius:6px;border:none;font-size:.9rem;}
  .tabs{display:flex;gap:4px;background:#00335c;border-radius:8px;padding:3px;}
  .tabs button{padding:6px 12px;border-radius:6px;border:none;background:transparent;color:#cfe3f2;font-size:.82rem;cursor:pointer;}
  .tabs button.activa{background:#fff;color:var(--azul);font-weight:600;}
  main{max-width:1000px;margin:0 auto;padding:20px 20px 90px;}
  section{margin-bottom:26px;}
  section h2{font-size:.95rem;color:var(--texto-suave);border-bottom:1px solid var(--borde);padding-bottom:6px;}
  .cabecera-genero{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
  .cabecera-genero h2{border:none;margin:0;font-size:1.1rem;color:var(--texto);}
  .grupo{background:#fff;border:1px solid var(--borde);border-radius:10px;padding:12px;margin-bottom:12px;}
  .grupo-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:.85rem;color:var(--texto-suave);}
  .tira{display:flex;gap:8px;flex-wrap:wrap;}
  .foto-card{position:relative;width:110px;text-align:center;font-size:.72rem;color:var(--texto-suave);}
  .foto-card img{width:110px;height:110px;object-fit:cover;border-radius:6px;background:#e0e0e0;display:block;border:3px solid transparent;}
  .foto-card.seleccionable img{cursor:pointer;}
  .foto-card.seleccionada img{border-color:var(--verde);}
  .foto-card input[type=checkbox]{position:absolute;top:4px;left:4px;width:18px;height:18px;pointer-events:none;}
  .foto-card .quitar{position:absolute;top:4px;right:4px;background:#fff;border:1px solid var(--borde);border-radius:50%;width:20px;height:20px;line-height:18px;cursor:pointer;font-size:.75rem;}
  .foto-card .especie{display:block;margin-top:3px;}
  .foto-card .limbo{display:block;color:var(--amarillo);font-weight:600;}
  .btn{padding:8px 14px;border-radius:8px;border:none;font-size:.85rem;font-weight:600;cursor:pointer;background:var(--verde);color:#fff;}
  .btn:disabled{opacity:.4;cursor:default;}
  .btn-secundario{background:#e0e0e0;color:#333;}
  .btn-revisado{background:var(--amarillo);color:#fff;}
  .vacio{color:var(--texto-suave);font-size:.85rem;padding:10px 0;}
  .barra-flotante{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--borde);padding:10px 20px;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;}
  .barra-flotante select{padding:6px 10px;border-radius:6px;border:1px solid var(--borde);}
  .manual{background:#fff;border:1px solid var(--borde);border-radius:10px;padding:10px 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.85rem;}
  .manual input{width:80px;padding:5px;border-radius:6px;border:1px solid var(--borde);}
  .cargando{color:var(--texto-suave);padding:30px;text-align:center;}
</style>
</head>
<body>
<header>
  <h1>Clustering por espécimen</h1>
  <div class="tabs">
    <button id="tabPendientes" class="activa">Pendientes</button>
    <button id="tabRevisados">Revisados</button>
  </div>
  <select id="selectorGenero"><option>Cargando géneros…</option></select>
  <span id="contadorGeneros" style="margin-left:auto;font-size:.85rem;color:#cfe3f2;white-space:nowrap;"></span>
  <span id="contadorFotos" style="font-size:.85rem;color:#cfe3f2;white-space:nowrap;"></span>
</header>
<main>
  <div class="manual">
    <strong>Override manual:</strong>
    <span>mover foto</span>
    <input type="number" id="inputFotoManual" placeholder="id foto">
    <span>al grupo</span>
    <input type="number" id="inputGrupoManual" placeholder="id grupo">
    <button class="btn btn-secundario" id="btnMoverManual">Mover</button>
    <span style="color:var(--texto-suave);">(para cuando la foto correcta está en otro género)</span>
  </div>
  <div id="contenido"><div class="cargando">Selecciona un género arriba.</div></div>
</main>
<div class="barra-flotante" id="barraFlotante" style="display:none;">
  <span id="contadorSeleccion">0 seleccionadas</span>
  <select id="selectorDestino"><option value="">Nuevo grupo</option></select>
  <button class="btn" id="btnConfirmarSeleccion">Confirmar grupo</button>
  <button class="btn btn-secundario" id="btnLimpiarSeleccion">Limpiar selección</button>
</div>
<script>
"use strict";

var seleccionadas = new Set();
var datosGeneroActual = null;
var todosLosGeneros = [];
var pestanaActual = "pendientes";

function badgeEspecie(foto) {
  if (foto.limbo) return foto.especie ? foto.especie + " (limbo)" : "(limbo, sin sugerencia)";
  return foto.especie ? foto.especie : "(sin especie)";
}

function fotoCardHtml(foto, quitable) {
  // Todas las tarjetas son seleccionables (para fusionar grupos hace falta poder
  // seleccionar fotos que ya estan en un grupo confirmado, no solo propuestas/sueltas).
  // Las de un grupo confirmado ademas conservan su boton de quitar individual.
  var seleccionada = seleccionadas.has(foto.foto_id);
  var chip = quitable
    ? '<button class="quitar" data-quitar="' + foto.foto_id + '" title="Quitar del grupo">✕</button>'
    : '<input type="checkbox" data-check="' + foto.foto_id + '" ' + (seleccionada ? "checked" : "") + '>';
  var claseLimbo = foto.limbo ? ' class="limbo"' : ' class="especie"';
  return (
    '<div class="foto-card seleccionable' + (seleccionada ? " seleccionada" : "") + '" data-card="' + foto.foto_id + '">' +
      chip +
      '<img src="/api/foto/' + foto.foto_id + '/imagen" alt="Foto ' + foto.foto_id + '">' +
      '<span>#' + foto.foto_id + '</span>' +
      '<span' + claseLimbo + '>' + badgeEspecie(foto) + '</span>' +
    '</div>'
  );
}

function actualizarBarra() {
  var barra = document.getElementById("barraFlotante");
  var contador = document.getElementById("contadorSeleccion");
  var selectorDestino = document.getElementById("selectorDestino");
  if (seleccionadas.size === 0) {
    barra.style.display = "none";
    return;
  }
  barra.style.display = "flex";
  contador.textContent = seleccionadas.size + " seleccionada(s)";
  var opciones = '<option value="">Nuevo grupo</option>';
  if (datosGeneroActual) {
    datosGeneroActual.grupos_confirmados.forEach(function (g) {
      opciones += '<option value="' + g.grupo_id + '">Unir a grupo #' + g.grupo_id + "</option>";
    });
  }
  selectorDestino.innerHTML = opciones;
}

function marcarCardSeleccionada(fotoId) {
  var card = document.querySelector('[data-card="' + fotoId + '"]');
  if (card) {
    card.classList.toggle("seleccionada", seleccionadas.has(fotoId));
    var chk = card.querySelector("input[type=checkbox]");
    if (chk) chk.checked = seleccionadas.has(fotoId);
  }
}

function alternarSeleccion(fotoId) {
  if (seleccionadas.has(fotoId)) seleccionadas.delete(fotoId); else seleccionadas.add(fotoId);
  marcarCardSeleccionada(fotoId);
  actualizarBarra();
}

function seleccionarVarias(fotoIds) {
  fotoIds.forEach(function (fotoId) {
    seleccionadas.add(fotoId);
    marcarCardSeleccionada(fotoId);
  });
  actualizarBarra();
}

function pintarGenero(data) {
  datosGeneroActual = data;
  seleccionadas.clear();
  var cont = document.getElementById("contenido");
  var html = "";

  html +=
    '<div class="cabecera-genero"><h2>' + data.genero + "</h2>" +
    '<button class="btn ' + (data.revisado ? "btn-revisado" : "btn-secundario") + '" id="btnRevisado">' +
    (data.revisado ? "✓ Género revisado (quitar marca)" : "Marcar género como revisado") +
    "</button></div>";

  html += "<section><h2>Grupos confirmados</h2>";
  if (data.grupos_confirmados.length === 0) {
    html += '<div class="vacio">Todavía no hay grupos confirmados en este género.</div>';
  } else {
    data.grupos_confirmados.forEach(function (g) {
      html +=
        '<div class="grupo"><div class="grupo-header"><span>Grupo #' + g.grupo_id + " · " + g.fotos.length + ' foto(s)</span>' +
        '<button class="btn btn-secundario" data-seleccionar-confirmado="' + g.grupo_id + '">Seleccionar todo</button></div>' +
        '<div class="tira">' + g.fotos.map(function (f) { return fotoCardHtml(f, true); }).join("") + "</div></div>";
    });
  }
  html += "</section>";

  html += "<section><h2>Propuestas (fotos parecidas entre sí, sin confirmar)</h2>";
  if (data.propuestas.length === 0) {
    html += '<div class="vacio">No se detectaron fotos parecidas entre sí en este género por ahora.</div>';
  } else {
    data.propuestas.forEach(function (p, idx) {
      html +=
        '<div class="grupo"><div class="grupo-header"><span>Propuesta ' + (idx + 1) + " · " + p.fotos.length + ' foto(s)</span>' +
        '<span>' +
        '<button class="btn btn-secundario" data-seleccionar-propuesta="' + idx + '">Seleccionar todo</button> ' +
        '<button class="btn" data-confirmar-propuesta="' + idx + '">Confirmar como grupo</button>' +
        "</span></div>" +
        '<div class="tira">' + p.fotos.map(function (f) { return fotoCardHtml(f, false); }).join("") + "</div></div>";
    });
  }
  html += "</section>";

  html += "<section><h2>Sueltas (sin pareja detectada, agrúpalas a mano si sabes que van juntas)</h2>";
  if (data.sueltas.length === 0) {
    html += '<div class="vacio">Ninguna.</div>';
  } else {
    html += '<div class="tira">' + data.sueltas.map(function (f) { return fotoCardHtml(f, false); }).join("") + "</div>";
  }
  html += "</section>";

  cont.innerHTML = html;

  cont.querySelectorAll(".foto-card.seleccionable").forEach(function (card) {
    card.querySelector("img").onclick = function () {
      alternarSeleccion(parseInt(card.dataset.card, 10));
    };
  });
  cont.querySelectorAll("[data-quitar]").forEach(function (btn) {
    btn.onclick = function () {
      fetch("/api/grupo/foto/" + btn.dataset.quitar, { method: "DELETE" })
        .then(function () { cargarGenero(data.genero); });
    };
  });
  cont.querySelectorAll("[data-confirmar-propuesta]").forEach(function (btn) {
    btn.onclick = function () {
      var idx = parseInt(btn.dataset.confirmarPropuesta, 10);
      var fotoIds = data.propuestas[idx].fotos.map(function (f) { return f.foto_id; });
      fetch("/api/grupo", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ foto_ids: fotoIds }),
      }).then(function () { cargarGenero(data.genero); });
    };
  });
  cont.querySelectorAll("[data-seleccionar-propuesta]").forEach(function (btn) {
    btn.onclick = function () {
      var idx = parseInt(btn.dataset.seleccionarPropuesta, 10);
      seleccionarVarias(data.propuestas[idx].fotos.map(function (f) { return f.foto_id; }));
    };
  });
  cont.querySelectorAll("[data-seleccionar-confirmado]").forEach(function (btn) {
    btn.onclick = function () {
      var gid = parseInt(btn.dataset.seleccionarConfirmado, 10);
      var grupo = data.grupos_confirmados.filter(function (g) { return g.grupo_id === gid; })[0];
      if (grupo) seleccionarVarias(grupo.fotos.map(function (f) { return f.foto_id; }));
    };
  });
  document.getElementById("btnRevisado").onclick = function () {
    var metodo = data.revisado ? "DELETE" : "POST";
    fetch("/api/genero/" + encodeURIComponent(data.genero) + "/revisado", { method: metodo })
      .then(function () { return fetch("/api/generos"); })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        todosLosGeneros = d.generos;
        // Refresca el dropdown filtrado por la pestana activa (no solo el detalle):
        // si se acaba de marcar como revisado estando en la pestana Pendientes, este
        // genero debe desaparecer de la lista de inmediato, no hasta recargar.
        pintarSelectorGeneros();
      });
  };

  actualizarBarra();
}

var cacheGeneroSiguiente = null;  // { genero, datos } precargado en segundo plano

function siguienteGeneroAlfabetico(genero) {
  var filtrados = todosLosGeneros.filter(function (g) {
    return pestanaActual === "revisados" ? g.revisado : !g.revisado;
  });
  var idx = filtrados.findIndex(function (g) { return g.genero === genero; });
  if (idx === -1 || idx + 1 >= filtrados.length) return null;
  return filtrados[idx + 1].genero;
}

function precargarSiguienteGenero(generoActual) {
  var siguiente = siguienteGeneroAlfabetico(generoActual);
  if (!siguiente) {
    cacheGeneroSiguiente = null;
    return;
  }
  fetch("/api/genero/" + encodeURIComponent(siguiente))
    .then(function (r) { return r.json(); })
    .then(function (datos) { cacheGeneroSiguiente = { genero: siguiente, datos: datos }; })
    .catch(function () { cacheGeneroSiguiente = null; });
}

function cargarGenero(genero) {
  if (cacheGeneroSiguiente && cacheGeneroSiguiente.genero === genero) {
    var datos = cacheGeneroSiguiente.datos;
    cacheGeneroSiguiente = null;
    pintarGenero(datos);
    precargarSiguienteGenero(genero);
    return;
  }
  document.getElementById("contenido").innerHTML = '<div class="cargando">Cargando…</div>';
  fetch("/api/genero/" + encodeURIComponent(genero))
    .then(function (r) { return r.json(); })
    .then(function (datos) {
      pintarGenero(datos);
      precargarSiguienteGenero(genero);
    });
}

function actualizarContadorGeneros() {
  var revisados = todosLosGeneros.filter(function (g) { return g.revisado; }).length;
  var pendientes = todosLosGeneros.length - revisados;
  document.getElementById("contadorGeneros").textContent =
    revisados + " géneros revisados · " + pendientes + " pendientes (" + todosLosGeneros.length + " en total)";

  var totalFotos = 0;
  var fotosPendientes = 0;
  todosLosGeneros.forEach(function (g) {
    totalFotos += g.total;
    fotosPendientes += g.pendientes;
  });
  var fotosAgrupadas = totalFotos - fotosPendientes;
  document.getElementById("contadorFotos").textContent =
    fotosAgrupadas + " fotos agrupadas · " + fotosPendientes + " sin agrupar (" + totalFotos + " en total)";
}

function pintarSelectorGeneros() {
  actualizarContadorGeneros();
  var sel = document.getElementById("selectorGenero");
  var filtrados = todosLosGeneros.filter(function (g) {
    return pestanaActual === "revisados" ? g.revisado : !g.revisado;
  });
  if (filtrados.length === 0) {
    sel.innerHTML = '<option value="">(ninguno en esta vista)</option>';
    document.getElementById("contenido").innerHTML =
      '<div class="vacio">No hay géneros ' + (pestanaActual === "revisados" ? "revisados" : "pendientes") + " todavía.</div>";
    return;
  }
  sel.innerHTML = filtrados
    .map(function (g) {
      return '<option value="' + g.genero + '">' + g.genero + " (" + g.pendientes + " pendientes / " + g.total + ")</option>";
    })
    .join("");
  cargarGenero(filtrados[0].genero);
}

document.getElementById("tabPendientes").onclick = function () {
  pestanaActual = "pendientes";
  document.getElementById("tabPendientes").classList.add("activa");
  document.getElementById("tabRevisados").classList.remove("activa");
  pintarSelectorGeneros();
};
document.getElementById("tabRevisados").onclick = function () {
  pestanaActual = "revisados";
  document.getElementById("tabRevisados").classList.add("activa");
  document.getElementById("tabPendientes").classList.remove("activa");
  pintarSelectorGeneros();
};

document.getElementById("btnConfirmarSeleccion").onclick = function () {
  if (seleccionadas.size === 0) return;
  var destino = document.getElementById("selectorDestino").value;
  var cuerpo = { foto_ids: Array.from(seleccionadas) };
  if (destino) cuerpo.grupo_id = parseInt(destino, 10);
  fetch("/api/grupo", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(cuerpo),
  }).then(function () {
    if (datosGeneroActual) cargarGenero(datosGeneroActual.genero);
  });
};

document.getElementById("btnLimpiarSeleccion").onclick = function () {
  seleccionadas.clear();
  if (datosGeneroActual) pintarGenero(datosGeneroActual);
};

document.getElementById("btnMoverManual").onclick = function () {
  var fotoId = parseInt(document.getElementById("inputFotoManual").value, 10);
  var grupoId = parseInt(document.getElementById("inputGrupoManual").value, 10);
  if (!fotoId || !grupoId) return;
  fetch("/api/grupo", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ foto_ids: [fotoId], grupo_id: grupoId }),
  }).then(function () {
    if (datosGeneroActual) cargarGenero(datosGeneroActual.genero);
  });
};

document.getElementById("selectorGenero").onchange = function () {
  cargarGenero(document.getElementById("selectorGenero").value);
};

fetch("/api/generos")
  .then(function (r) { return r.json(); })
  .then(function (data) {
    todosLosGeneros = data.generos;
    pintarSelectorGeneros();
  });
</script>
</body>
</html>
