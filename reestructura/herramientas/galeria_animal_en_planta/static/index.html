<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Revisor · Ave/Insecto/Ninguno</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{ --azul:#004270; --texto:#2C343A; --texto-suave:#656d7e; --fondo:#f2f2f5; --borde:#dde1e6; --verde:#1a7f4e; }
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Segoe UI",Roboto,Arial,sans-serif;background:var(--fondo);color:var(--texto);}
  header{background:var(--azul);color:#f6f8fa;padding:14px 24px;}
  header h1{font-size:1.1rem;margin:0 0 4px;}
  header p{margin:0;font-size:.85rem;color:#bfe3f5;}
  main{max-width:700px;margin:0 auto;padding:20px;}
  .tarjeta{background:#fff;border:1px solid var(--borde);border-radius:12px;padding:20px;text-align:center;}
  .tarjeta img{max-width:100%;max-height:60vh;border-radius:8px;background:#eee;display:block;margin:0 auto 14px;}
  .badge{display:inline-block;font-size:.78rem;font-weight:700;padding:3px 10px;border-radius:20px;margin-bottom:10px;}
  .badge.insecto{background:#ffe08a;color:#5c4300;}
  .badge.ave{background:#a8d8ff;color:#00304d;}
  .badge.sin-score{background:#e0e0e0;color:#555;}
  .meta{font-size:.85rem;color:var(--texto-suave);margin-bottom:16px;}
  .decisiones{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
  .decisiones button{padding:12px 18px;border-radius:10px;border:none;font-size:.92rem;font-weight:600;cursor:pointer;min-width:110px;}
  .decisiones button .tecla{opacity:.6;font-weight:400;font-size:.78rem;display:block;}
  .btn-ave{background:#a8d8ff;color:#00304d;}
  .btn-insecto{background:#ffe08a;color:#5c4300;}
  .btn-mamifero{background:#d9b38c;color:#3d2811;}
  .btn-anfibio_reptil{background:#b7e4c7;color:#1b4332;}
  .btn-hongo{background:#e0c3fc;color:#3d2461;}
  .btn-planta{background:#c5e8b7;color:#284a1b;}
  .btn-sin_sujeto{background:#e0e0e0;color:#333;}
  .decisiones button:hover{filter:brightness(0.95);}
  .decisiones button:disabled{opacity:.5;cursor:default;}
  .vacio,.cargando{text-align:center;padding:60px 20px;color:var(--texto-suave);}
  .saltar{margin-top:14px;background:none;border:none;color:var(--texto-suave);text-decoration:underline;cursor:pointer;font-size:.85rem;}
  .deshacer{display:block;margin:10px auto 0;background:none;border:1px solid var(--borde);border-radius:8px;padding:6px 14px;color:var(--texto-suave);cursor:pointer;font-size:.82rem;}
  .deshacer:disabled{opacity:.4;cursor:default;}
</style>
</head>
<body>
<header>
  <h1>Revisor · todo el catálogo</h1>
  <p id="contador">Cargando…</p>
</header>
<main>
  <div id="contenido"><div class="cargando">Cargando…</div></div>
</main>
<script>
"use strict";

var itemsGlobal = [];
var cola = [];
var enviando = false;
var historial = [];
var precargadas = [];  // referencias a Image() vivas, para que el navegador no descarte
// la descarga a medio camino; se limita el tamano para no acumular memoria en una
// sesion larga de miles de fotos

var OPCIONES = [
  { d: "ave", etiqueta: "🐦 Ave", tecla: "1" },
  { d: "insecto", etiqueta: "🐛 Insecto", tecla: "2" },
  { d: "mamifero", etiqueta: "🐾 Mamífero", tecla: "3" },
  { d: "anfibio_reptil", etiqueta: "🐸 Anfibio/Reptil", tecla: "4" },
  { d: "hongo", etiqueta: "🍄 Hongo", tecla: "5" },
  { d: "planta", etiqueta: "🌿 Planta (sin animal)", tecla: "6" },
  { d: "sin_sujeto", etiqueta: "🎨 Sin sujeto claro", tecla: "7" },
];

function badgeHtml(item) {
  if (item.tipo_probable === null) return '<span class="badge sin-score">Sin evaluar por BioCLIP</span>';
  var etiqueta = item.tipo_probable === "insecto" ? "🐛 Insecto" : "🐦 Ave";
  return '<span class="badge ' + item.tipo_probable + '">' + etiqueta + ' (BioCLIP: ' + Math.round(item.score * 100) + '%)</span>';
}

function actualizarCola() {
  cola = itemsGlobal.filter(function (it) { return it.disponible && !it.decision; });
}

function actualizarContador() {
  var revisadas = itemsGlobal.filter(function (it) { return it.decision; }).length;
  var sinRed = itemsGlobal.filter(function (it) { return !it.disponible; }).length;
  document.getElementById("contador").textContent =
    cola.length + " pendientes · " + revisadas + " revisadas esta sesión" +
    (sinRed > 0 ? " · " + sinRed + " sin red/espejo local" : "");
}

function pintarItemActual() {
  var cont = document.getElementById("contenido");
  actualizarContador();
  if (cola.length === 0) {
    cont.innerHTML = '<div class="vacio">🎉 No hay nada pendiente ahorita.</div>';
    return;
  }
  var item = cola[0];
  enviando = false;
  var botonesHtml = OPCIONES.map(function (op) {
    return '<button class="btn-' + op.d + '" data-d="' + op.d + '">' + op.etiqueta + '<span class="tecla">tecla ' + op.tecla + '</span></button>';
  }).join("");
  cont.innerHTML =
    '<div class="tarjeta">' +
      '<img src="/api/foto/' + item.foto_id + '/imagen" alt="Foto ' + item.foto_id + '">' +
      '<div>' + badgeHtml(item) + '</div>' +
      '<div class="meta">Foto ' + item.foto_id + (item.especie_confirmada ? ' · ' + item.especie_confirmada : '') + '</div>' +
      '<div class="decisiones">' + botonesHtml + '</div>' +
      '<button class="saltar">Saltar por ahora (tecla 0) →</button>' +
      '<button class="deshacer"' + (historial.length === 0 ? ' disabled' : '') + '>↩ Deshacer última (tecla Z)</button>' +
    '</div>';

  cont.querySelectorAll(".decisiones button").forEach(function (btn) {
    btn.onclick = function () { enviarDecision(item, btn.dataset.d); };
  });
  cont.querySelector(".saltar").onclick = function () {
    cola.push(cola.shift());
    pintarItemActual();
  };
  cont.querySelector(".deshacer").onclick = deshacerUltima;

  precargarSiguientes();
}

function precargarSiguientes() {
  cola.slice(1, 9).forEach(function (item) {
    var img = new Image();
    img.src = "/api/foto/" + item.foto_id + "/imagen";
    precargadas.push(img);
  });
  if (precargadas.length > 20) precargadas.splice(0, precargadas.length - 20);
}

function enviarDecision(item, decision) {
  if (enviando) return;
  enviando = true;
  document.querySelectorAll(".decisiones button").forEach(function (b) { b.disabled = true; });
  fetch("/api/decision", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ foto_id: item.foto_id, decision: decision }),
  })
    .then(function () {
      historial.push(item.foto_id);
      item.decision = decision;
      cola.shift();
      pintarItemActual();
    })
    .catch(function () {
      enviando = false;
      document.querySelectorAll(".decisiones button").forEach(function (b) { b.disabled = false; });
    });
}

function deshacerUltima() {
  if (enviando || historial.length === 0) return;
  var fotoId = historial.pop();
  var item = itemsGlobal.filter(function (it) { return it.foto_id === fotoId; })[0];
  if (!item) { pintarItemActual(); return; }
  enviando = true;
  fetch("/api/decision/" + fotoId, { method: "DELETE" })
    .then(function () {
      enviando = false;
      item.decision = null;
      actualizarCola();
      cola = cola.filter(function (it) { return it.foto_id !== fotoId; });
      cola.unshift(item);
      pintarItemActual();
    })
    .catch(function () {
      enviando = false;
      historial.push(fotoId);
    });
}

document.addEventListener("keydown", function (e) {
  if (enviando) return;
  if ((e.key === "z" || e.key === "Z") && historial.length > 0) {
    deshacerUltima();
    return;
  }
  if (cola.length === 0) return;
  var item = cola[0];
  if (e.key === "0") {
    cola.push(cola.shift());
    pintarItemActual();
    return;
  }
  var opcion = OPCIONES.filter(function (op) { return op.tecla === e.key; })[0];
  if (opcion) enviarDecision(item, opcion.d);
});

fetch("/api/galeria")
  .then(function (r) { return r.json(); })
  .then(function (data) {
    itemsGlobal = data.items;
    actualizarCola();
    pintarItemActual();
  })
  .catch(function (e) {
    document.getElementById("contador").textContent = "Error al cargar: " + e.message;
  });
</script>
</body>
</html>
