<title>Componentes Campus Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.bunny.net/css?family=figtree:400,400i,500,500i,600,700&display=swap">
<style>
:root { --page: #f3f6f5; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --page: #0c171e; color-scheme: dark; } }
:root[data-theme="dark"] { --page: #0c171e; color-scheme: dark; }
body { background: var(--page); }

/* ═══ cl-base.css (la misma del prototipo de plantillas) ═══ */
.cl {
  --u: clamp(16px, 10.8px + .36vw, 22px); /* tamaño base: 16 px hasta ~1440 px de ancho, crece hasta 22 px en monitores anchos (2560-3440) */
  color-scheme: light dark; /* sigue al dispositivo; data-modo (elección guardada) manda encima. CSS y JS coinciden: no parpadea */
  --cl-bg: light-dark(#f3f6f5, #0c171e); --cl-sf: light-dark(#fbfcfc, #13222b); --cl-ink: light-dark(#12283a, #e3ece9);
  --cl-ink2: light-dark(#4a5d69, #9db0b5); --cl-line: light-dark(#d2dcdb, #29404a);
  --cl-acc: var(--f1i); --cl-fill: light-dark(var(--f1i), var(--f1)); --cl-on-fill: light-dark(#fbfcfc, #0c171e);
  --cl-wash: color-mix(in srgb, var(--f1) 14%, var(--cl-sf)); --cl-leaf: var(--f2);
  --cl-font: "Degular", "Figtree", system-ui, sans-serif; --cl-mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
  --cl-r: 8px; --cl-ease: cubic-bezier(0.23, 1, 0.32, 1); --cl-ease-io: cubic-bezier(0.77, 0, 0.175, 1);
  background: var(--cl-bg); color: var(--cl-ink); font: var(--u)/1.5 var(--cl-font); min-height: 100vh;
}
.cl[data-modo="claro"] { color-scheme: light; } .cl[data-modo="oscuro"] { color-scheme: dark; }
:root[data-theme="dark"] .cl:not([data-modo]) { color-scheme: dark; } :root[data-theme="light"] .cl:not([data-modo]) { color-scheme: light; }
.cl, .cl[data-floracion="lluvias"], .cl [data-floracion="lluvias"] { --f1: light-dark(#2e8a52, #6fd296); --f1i: light-dark(#297b49, #6fd296); --f2: light-dark(#3a7090, #7fbede); }
.cl[data-floracion="clavellina"], .cl [data-floracion="clavellina"] { --f1: light-dark(#c2416a, #f2809c); --f1i: light-dark(#c03e67, #f2809c); --f2: light-dark(#7a5a3e, #c9a27e); }
.cl[data-floracion="rosa-morada"], .cl [data-floracion="rosa-morada"] { --f1: light-dark(#c45a9c, #f08cc8); --f1i: light-dark(#b8428c, #f08cc8); --f2: light-dark(#4c7758, #86c09a); }
.cl[data-floracion="jacaranda"], .cl [data-floracion="jacaranda"] { --f1: light-dark(#7b5cc8, #b8a0f5); --f1i: light-dark(#7858c7, #b8a0f5); --f2: light-dark(#3f7a4c, #82c492); }
.cl[data-floracion="primavera"], .cl [data-floracion="primavera"] { --f1: light-dark(#e0ab12, #f4cc4e); --f1i: light-dark(#8b6a0b, #f4cc4e); --f2: light-dark(#5f7434, #a8c46a); }
.cl[data-floracion="tabachin"], .cl [data-floracion="tabachin"] { --f1: light-dark(#d9431f, #ff7d55); --f1i: light-dark(#c73d1c, #ff7d55); --f2: light-dark(#3b7840, #7cc482); }
.cl[data-floracion="galeana"], .cl [data-floracion="galeana"] { --f1: light-dark(#e06a12, #ff9e4e); --f1i: light-dark(#b1540e, #ff9e4e); --f2: light-dark(#2e6f5c, #6ec2a6); }
@supports not (color: light-dark(red, red)) { .cl { --cl-bg: #f3f6f5; --cl-sf: #fbfcfc; --cl-ink: #12283a; --cl-ink2: #4a5d69; --cl-line: #d2dcdb; --cl-fill: var(--f1i); --cl-on-fill: #fbfcfc; --f1: #2e8a52; --f1i: #297b49; --f2: #3a7090; } }
.cl *, .cl *::before, .cl *::after { box-sizing: border-box; }
.cl :where(h1, h2, h3, p, dl, dd, figure, ul, ol) { margin: 0; }
.cl :where(h1, h2, h3) { text-wrap: balance; line-height: 1.1; }
.cl :where(button, input, select) { font: inherit; color: inherit; }
.cl :focus-visible { outline: 2px solid var(--cl-acc); outline-offset: 2px; border-radius: 4px; }
.cl .muted { color: var(--cl-ink2); }
.cl .sci { font-style: italic; }
.cl .btn { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 14px; border-radius: 999px; border: 1.5px solid var(--cl-line); background: var(--cl-sf); cursor: pointer; white-space: nowrap; transition: transform 140ms var(--cl-ease); }
.cl .btn:active { transform: scale(0.97); }
.cl .btn[aria-pressed="true"], .cl .btn.solid { background: var(--cl-fill); border-color: var(--cl-fill); color: var(--cl-on-fill); }
.cl .field { width: 100%; min-height: 42px; padding: 0 14px; border-radius: var(--cl-r); border: 1.5px solid var(--cl-ink2); background: var(--cl-sf); }
.cl .field::placeholder { color: var(--cl-ink2); }
.cl .card { background: var(--cl-sf); border: 1px solid var(--cl-line); border-radius: var(--cl-r); }
.cl .placa { display: inline-flex; align-items: baseline; gap: 6px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: .05em; padding: 4px 10px; border-radius: 4px; border: 1.5px solid var(--cl-ink2); background: linear-gradient(180deg, var(--cl-sf), color-mix(in srgb, var(--cl-line) 55%, var(--cl-sf))); text-shadow: 0 1px 0 var(--cl-sf); }
.cl .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (hover: hover) and (pointer: fine) { .cl .btn:hover { border-color: var(--cl-acc); } }

/* ═══ Página de muestras ═══ */
.shell { padding-block: 18px 64px; padding-left: max(clamp(16px, 5vw, 120px), env(safe-area-inset-left, 0px)); padding-right: max(clamp(16px, 5vw, 120px), env(safe-area-inset-right, 0px)); display: grid; gap: 28px; } /* todo el ancho disponible (pedido de Maya, 20-oct) */
.top { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: end; justify-content: space-between; }
.top h1 { font-size: clamp(calc(1.9 * var(--u)), 4.6vw, calc(2.7 * var(--u))); font-weight: 700; }
.top p { max-width: 62ch; color: var(--cl-ink2); margin-top: 6px; }
.tools { display: flex; gap: 8px; flex-wrap: wrap; }
.flor-pick { position: relative; }
.flor-pick select { appearance: none; min-height: 36px; padding: 0 32px 0 30px; border-radius: 999px; border: 1.5px solid var(--cl-line); background: var(--cl-sf); cursor: pointer; }
.flor-pick::before { content: ""; position: absolute; left: 11px; top: 50%; translate: 0 -50%; width: 12px; height: 12px; border-radius: 50%; background: var(--f1); box-shadow: 4px 0 0 -1px var(--f2); pointer-events: none; }
.flor-pick::after { content: ""; position: absolute; right: 13px; top: 50%; width: 7px; height: 7px; border-right: 1.5px solid var(--cl-ink2); border-bottom: 1.5px solid var(--cl-ink2); translate: 0 -70%; rotate: 45deg; pointer-events: none; }
.grupo { display: grid; gap: 14px; }
.grupo + .grupo { margin-top: 0; } /* el título de sección se lee con sus tarjetas, no con las de arriba */
.grupo > h2 { font-size: calc(1.35 * var(--u)); display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.grupo > h2 small { font-size: calc(.95 * var(--u)); font-weight: 400; color: var(--cl-ink2); }
#grupos { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, calc(80 * var(--u))), 1fr)); gap: 22px 28px; align-items: start; } /* dos grupos por renglón desde ~3000 px */
.demos { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, calc(25 * var(--u))), 1fr)); gap: 14px; } /* auto-fit: las tarjetas llenan el renglón, sin columnas vacías */
.demo { display: grid; grid-template-rows: auto 1fr auto; overflow: hidden; }
.demo .stage { position: relative; min-height: 230px; display: grid; place-items: center; padding: 18px; background: var(--cl-bg); border-bottom: 1px solid var(--cl-line); overflow: hidden; }
.demo .info { padding: 14px 16px; display: grid; gap: 6px; align-content: start; }
.demo h3 { font-size: calc(1.08 * var(--u)); display: flex; gap: 10px; align-items: baseline; }
.demo h3 .n { font-variant-numeric: tabular-nums; color: var(--cl-acc); font-weight: 700; }
.demo .info p { color: var(--cl-ink2); font-size: calc(.94 * var(--u)); }
.demo .info p b { color: var(--cl-ink); font-weight: 600; }
.demo .pie { display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap; padding: 0 16px 14px; }
.peso { font-size: calc(.82 * var(--u)); color: var(--cl-ink2); padding: 2px 10px; border-radius: 999px; border: 1px solid var(--cl-line); }

/* 1 · Revelado de foto */
.rev { width: min(100%, calc(22.5 * var(--u))); aspect-ratio: 4 / 3; border-radius: var(--cl-r); overflow: hidden; }
.rev img { width: 100%; height: 100%; object-fit: cover; display: block; }
.rev.pre { clip-path: inset(0 0 100% 0); }
.rev.go { clip-path: inset(0 0 0 0); transition: clip-path 700ms var(--cl-ease-io); }
.rev.go img { animation: revz 900ms var(--cl-ease) both; }
@keyframes revz { from { transform: scale(1.12); } to { transform: none; } }

/* 2 · Cifras */
.cifras { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; width: 100%; }
.cifra { display: grid; gap: 2px; text-align: center; }
.cifra b { font-size: clamp(calc(1.8 * var(--u)), 5vw, calc(2.6 * var(--u))); font-weight: 700; font-variant-numeric: tabular-nums; color: var(--cl-acc); line-height: 1; }
.cifra span { font-size: calc(.9 * var(--u)); color: var(--cl-ink2); }

/* 3 · Anillos que crecen */
/* cada anillo es una banda (corona entre dos radios, evenodd): no tapa a los de adentro y cada uno se toca solo */
.grow { display: grid; justify-items: center; gap: 6px; }
.grow svg { width: calc(12.5 * var(--u)); height: auto; overflow: visible; }
.grow .ring { cursor: pointer; transform-origin: 100px 100px; }
.grow .ring:focus { outline: none; }
.grow .ring path { fill-rule: evenodd; stroke: var(--cl-sf); stroke-width: 1.5; }
.grow .has path { fill: color-mix(in srgb, var(--f1) var(--mix), var(--cl-sf)); }
.grow .no path { fill: var(--cl-sf); stroke: var(--cl-ink2); stroke-width: 1.2; stroke-dasharray: 3 4; }
.grow .ring:hover path, .grow .ring:focus-visible path { stroke: var(--cl-ink); stroke-width: 2; }
.grow .ring[aria-pressed="true"] path { stroke: var(--cl-ink); stroke-width: 2.4; stroke-dasharray: none; }
.grow.pre .ring { transform: scale(.3); opacity: 0; }
.grow.go .ring { transition: transform 800ms var(--cl-ease), opacity 400ms ease; transition-delay: var(--d); }
.grow .medula { fill: var(--cl-fill); pointer-events: none; }
.grow text { fill: var(--cl-on-fill); font-weight: 700; font-size: 15px; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.grow output { min-height: 1.4em; font-size: calc(.92 * var(--u)); color: var(--cl-ink2); }

/* 4 · Comparador */
.cmp { position: relative; width: min(100%, calc(23.75 * var(--u))); aspect-ratio: 4 / 3; border-radius: var(--cl-r); overflow: hidden; }
.cmp img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.cmp .b { clip-path: inset(0 0 0 var(--x, 50%)); }
.cmp .linea { position: absolute; top: 0; bottom: 0; left: var(--x, 50%); width: 2px; translate: -1px 0; background: var(--cl-sf); pointer-events: none; }
.cmp .linea::after { content: ""; position: absolute; top: 50%; left: 50%; width: 30px; height: 30px; translate: -50% -50%; border-radius: 50%; background: var(--cl-sf); border: 2px solid var(--cl-fill); }
.cmp input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: ew-resize; margin: 0; }
.cmp .et { position: absolute; bottom: 8px; font-size: calc(.8 * var(--u)); font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--cl-sf); color: var(--cl-ink); }
.cmp .et.l { left: 8px; } .cmp .et.r { right: 8px; }
.cmp:has(input:focus-visible) { outline: 2px solid var(--cl-acc); outline-offset: 2px; }

/* 5 · Carrusel de partes */
.carr { width: 100%; display: grid; gap: 10px; }
.carr-track { display: grid; grid-auto-flow: column; grid-auto-columns: 72%; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; padding-inline: 14%; }
.carr-track::-webkit-scrollbar { display: none; }
.carr-track figure { scroll-snap-align: center; display: grid; gap: 4px; }
.carr-track img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: var(--cl-r); display: block; }
.carr-track figcaption { font-size: calc(.85 * var(--u)); color: var(--cl-ink2); text-align: center; }
.carr-nav { display: flex; justify-content: center; gap: 8px; align-items: center; }
.carr-dots { display: flex; gap: 6px; }
.carr-dots button { width: 24px; height: 24px; border: 0; background: none; padding: 0; cursor: pointer; display: grid; place-items: center; }
.carr-dots button::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--cl-line); transition: width 200ms var(--cl-ease), background-color 200ms ease; }
.carr-dots button[aria-current="true"]::before { width: 20px; border-radius: 4px; background: var(--cl-fill); }

/* 6 · Tarjeta que se voltea */
.flip { width: 200px; aspect-ratio: 3 / 4; perspective: 900px; border: 0; padding: 0; background: none; cursor: pointer; }
.flip-in { display: block; position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform 520ms var(--cl-ease-io); }
.flip[aria-pressed="true"] .flip-in { transform: rotateY(180deg); }
.flip .cara { position: absolute; inset: 0; backface-visibility: hidden; border-radius: var(--cl-r); overflow: hidden; border: 1px solid var(--cl-line); background: var(--cl-sf); display: grid; text-align: left; }
.flip .cara img { width: 100%; height: 100%; object-fit: cover; }
.flip .frente span { position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 10px 8px; font-weight: 700; color: #f4f7f6; background: linear-gradient(transparent, rgba(8, 20, 28, .85)); }
.flip .dorso { transform: rotateY(180deg); padding: 14px; align-content: start; gap: 6px; font-size: calc(.9 * var(--u)); }
.flip .dorso b { font-size: calc(1.1 * var(--u)); }
.flip .dorso .dots { display: flex; gap: 4px; margin-top: 4px; }
.flip .dorso .dots i { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--cl-ink2); }
.flip .dorso .dots i.on { background: var(--cl-fill); border-color: var(--cl-fill); }

/* 7 · Autocompletado */
.ac { width: min(100%, calc(23.75 * var(--u))); position: relative; align-self: start; }
.ac-pista { margin: 10px 0 0; font-size: calc(.9 * var(--u)); color: var(--cl-ink2); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.ac-pista button { font: inherit; color: var(--cl-acc); background: none; border: 1.5px solid var(--cl-line); border-radius: 999px; padding: 2px 10px; cursor: pointer; }
.ac ul:not([hidden]) ~ .ac-pista { display: none; }
.ac ul { list-style: none; margin: 6px 0 0; padding: 4px; border-radius: var(--cl-r); border: 1px solid var(--cl-line); background: var(--cl-sf); max-height: 190px; overflow: auto; }
.ac li { padding: 6px 10px; border-radius: 6px; cursor: pointer; display: flex; justify-content: space-between; gap: 10px; }
.ac li[aria-selected="true"] { background: var(--cl-wash); }
.ac li mark { background: none; color: var(--cl-acc); font-weight: 700; padding: 0; margin: 0; box-shadow: none; } /* el Bootstrap del tema le pone relleno y fondo a <mark> */
.ac li small { color: var(--cl-ink2); font-style: italic; }
.ac .vacio { padding: 8px 10px; color: var(--cl-ink2); }

/* 8 · Filtro con reacomodo */
.flipgrid { width: 100%; display: grid; gap: 10px; align-self: start; }
.fg-chips { display: flex; gap: 6px; flex-wrap: wrap; }
.fg { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 6px; }
.fg > * { aspect-ratio: 1; border-radius: 6px; overflow: hidden; background: var(--cl-sf); border: 1.5px dashed var(--cl-ink2); display: grid; place-items: center; font-size: calc(.72 * var(--u)); text-align: center; color: var(--cl-ink2); padding: 2px; }
.fg > .f { border: 0; padding: 0; }
.fg img { width: 100%; height: 100%; object-fit: cover; }

/* 9 · Placa tipo tablero */
.flap { display: flex; gap: 4px; perspective: 400px; }
.flap .d { position: relative; width: 44px; height: 62px; border-radius: 6px; background: var(--cl-ink); color: var(--cl-bg); font-size: calc(2.3 * var(--u)); font-weight: 700; font-variant-numeric: tabular-nums; display: grid; place-items: center; overflow: hidden; }
.flap .d::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: color-mix(in srgb, var(--cl-bg) 40%, transparent); }
.flap .d.go span { animation: flapin 260ms var(--cl-ease) both; animation-delay: var(--d); }
@keyframes flapin { from { transform: rotateX(-88deg); opacity: .2; } to { transform: none; opacity: 1; } }
.flap-wrap { display: grid; gap: 12px; justify-items: center; }

/* 10 · Mapa con pulso */
.minimapa { width: 100%; border-radius: var(--cl-r); overflow: hidden; background: var(--cl-sf); border: 1px solid var(--cl-line); }
.minimapa svg { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; }
.minimapa .bld { fill: color-mix(in srgb, var(--cl-line) 80%, var(--cl-sf)); }
.minimapa .cam { fill: none; stroke: var(--cl-line); stroke-width: 1.4; }
.minimapa .pt { fill: color-mix(in srgb, var(--cl-leaf) 60%, var(--cl-sf)); }
.minimapa.go .pt { animation: ptin 400ms var(--cl-ease) both; animation-delay: var(--d); }
@keyframes ptin { from { opacity: 0; } to { opacity: 1; } }
.minimapa .yo { fill: var(--cl-fill); }
.minimapa .pulso { fill: none; stroke: var(--cl-fill); stroke-width: 2; transform-box: fill-box; transform-origin: center; animation: pulso 1.8s var(--cl-ease) infinite; }
@keyframes pulso { from { transform: scale(.6); opacity: 1; } to { transform: scale(2.6); opacity: 0; } }

/* 11 · Temporada (canvas) */
.temp { position: relative; width: 100%; height: 230px; border-radius: var(--cl-r); overflow: hidden; background: var(--cl-wash); }
.temp canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.temp p { position: absolute; left: 14px; bottom: 12px; font-weight: 700; font-size: calc(1.3 * var(--u)); }

/* 12 · Recorrido del año */
.anio { width: 100%; display: grid; gap: 12px; }
.anio-ficha { display: grid; grid-template-columns: 90px minmax(0, 1fr); gap: 12px; align-items: center; padding: 12px; border-radius: var(--cl-r); background: var(--cl-sf); border: 1px solid var(--cl-line); }
.anio-ficha .sw { width: 90px; height: 90px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, var(--f1) 0 45%, var(--f2) 46%); transition: background 600ms ease; }
.anio-ficha b { font-size: calc(1.3 * var(--u)); color: var(--cl-acc); transition: color 600ms ease; }
.anio .meses { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 3px; }
.anio .meses span { height: 8px; border-radius: 4px; background: var(--cl-line); transition: background-color 300ms ease; }
.anio .meses span.on { background: var(--cl-fill); }

/* 13 · Esqueleto de carga */
.skel { width: min(100%, calc(23.75 * var(--u))); display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 12px; align-items: start; }
.skel .b { border-radius: 6px; background: linear-gradient(90deg, var(--cl-line) 0 40%, color-mix(in srgb, var(--cl-line) 45%, var(--cl-sf)) 50%, var(--cl-line) 60% 100%); background-size: 250% 100%; animation: shimmer 1.3s linear infinite; }
@keyframes shimmer { from { background-position: 100% 0; } to { background-position: 0 0; } }
.skel .foto { aspect-ratio: 1; }
.skel .lineas { display: grid; gap: 8px; }
.skel .lineas .b { height: 14px; }
.skel img { width: 110px; aspect-ratio: 1; object-fit: cover; border-radius: 6px; display: block; }
.skel .txt { display: grid; gap: 2px; animation: fadein 260ms var(--cl-ease) both; }
@keyframes fadein { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

/* 14 · Copiar enlace + aviso */
.share { display: grid; gap: 10px; justify-items: center; }
.share code { font-family: var(--cl-mono); font-size: calc(.8 * var(--u)); color: var(--cl-ink2); overflow-wrap: anywhere; text-align: center; }
.toast { position: absolute; left: 50%; bottom: 16px; translate: -50% 0; padding: 8px 16px; border-radius: 999px; background: var(--cl-ink); color: var(--cl-bg); font-weight: 600; font-size: calc(.92 * var(--u)); opacity: 0; transform: translateY(12px); transition: opacity 200ms ease, transform 200ms var(--cl-ease); pointer-events: none; }
.toast.on { opacity: 1; transform: none; }

/* 15 · Árbol con su QR */
.qrv { width: min(100%, calc(26 * var(--u))); display: grid; gap: 10px; justify-items: center; }
.qrv canvas { width: 100%; display: block; cursor: pointer; touch-action: manipulation; }
.qrv-pista { margin: 0; padding: 3px 12px; border-radius: 999px; border: 1px solid var(--cl-line); font-size: calc(.85 * var(--u)); color: var(--cl-ink2); text-align: center; }
.qrv-fila { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.qrv-esp button { width: 34px; height: 34px; padding: 0; border-radius: 50%; border: 3px solid var(--cl-sf); background: var(--c); box-shadow: 0 0 0 1.5px var(--cl-line); cursor: pointer; }
.qrv-esp button[aria-pressed="true"] { box-shadow: 0 0 0 2.5px var(--cl-ink); }

@media (prefers-reduced-motion: reduce) {

    function medir() { W = cv.clientWidth || 320; H = Math.round(W * 1.04); dpr = Math.min(window.devicePixelRatio || 1, 2); cv.width = W * dpr; cv.height = H * dpr; cv.style.height = H + "px"; }
    function rotulo() {
      var es = ESP[S.e];
      pista.textContent = S.t ? "Escanéalo con la cámara del celular · toca para volver al árbol" : es[1] + " · toca el árbol para ver el QR de su ficha";
      el.querySelector('[data-accion="ver"]').textContent = S.t ? "Ver el árbol" : "Ver su QR";
      cv.setAttribute("role", "img");
      cv.setAttribute("aria-label", S.t ? "Código QR que lleva a la ficha de " + es[1] + " (" + url.replace("https://", "") + ")" : es[1] + " sobre el código QR de su ficha; su copa forma el centro del código");
    }
    var girando = false;
    function voltear() {
      if (girando) return; girando = true;
      var desde = S.t, hacia = S.t ? 0 : 1, t0 = performance.now(), dur = reduce.matches ? 1 : 1500;

      requestAnimationFrame(paso);
    }
    function rehacer() { construir(); sembrar(); pintar(S.t); rotulo(); sigue(); }
    /* QR plano para imprimir: módulos de 16 px, margen de 4 módulos y el nombre debajo */
    function descargar() {
      var es = ESP[S.e], Q = qrCodigo(url), m = 16, q = 4, lado = (Q.length + 2 * q) * m, c = document.createElement("canvas"), g = c.getContext("2d"), fam = getComputedStyle(el).fontFamily;
      c.width = lado; c.height = lado + 70; g.fillStyle = "#ffffff"; g.fillRect(0, 0, c.width, c.height); g.fillStyle = "#1b2a1f";
      Q.forEach(function (fila, y) { fila.forEach(function (v, x) { if (v) g.fillRect((x + q) * m, (y + q) * m, m, m); }); });
      g.textAlign = "center"; g.font = "600 30px " + fam; g.fillText(es[1], lado / 2, lado + 18);
      g.font = "20px " + fam; g.fillStyle = "#4a5d69"; g.fillText(url.replace("https://", ""), lado / 2, lado + 50);
      c.toBlob(function (b) { var a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = "qr-" + es[0] + ".png"; document.body.appendChild(a); a.click(); a.remove(); setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000); });
    }

    cv.addEventListener("click", voltear);
    el.querySelector(".qrv").addEventListener("click", function (ev) {
      var b = ev.target.closest("button"); if (!b) return;
      if (b.dataset.e) { S.e = +b.dataset.e; el.querySelectorAll("[data-e]").forEach(function (x) { x.setAttribute("aria-pressed", String(x === b)); }); rehacer(); }
      if (b.dataset.t) { S.temp = b.dataset.t; el.querySelectorAll("[data-t]").forEach(function (x) { x.setAttribute("aria-pressed", String(x === b)); }); rehacer(); }
      if (b.dataset.accion === "ver") voltear();
      if (b.dataset.accion === "bajar") descargar();
    });
    new IntersectionObserver(function (en) { visible = en[0].isIntersecting; sigue(); }).observe(el);
    var rt; if (window.ResizeObserver) new ResizeObserver(function () { clearTimeout(rt); rt = setTimeout(function () { var w = cv.clientWidth; if (w && Math.abs(w - W) > 1) { medir(); pintar(S.t); } }, 100); }).observe(cv);
    medir(); rehacer();
  };

  /* las que se animan arrancan al verse (una vez); las demás se montan de inmediato */
  var montar = function (k) { M[k](st(k)); };
  var io = new IntersectionObserver(function (en) { en.forEach(function (x) { if (x.isIntersecting) { io.unobserve(x.target); montar(x.target.dataset.demo); } }); }, { threshold: .35 });
  Object.keys(M).forEach(function (k) { if (REPLAY[k]) { st(k).innerHTML = ""; io.observe(st(k)); } else montar(k); });
  document.addEventListener("click", function (ev) { var b = ev.target.closest("[data-replay]"); if (b) montar(b.dataset.replay); });
})();
