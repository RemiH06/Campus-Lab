 <style type="text/css">/* Eliminar márgenes y rellenos del body */

		body{
		
			margin: 0px;
			padding:0px;
		}

        /* Aseguramos que las imágenes sean responsivas */
        .img-banner {
            width: 100%;
            height: auto;
            display: block; /* Elimina el espacio debajo de la imagen */
        }
		.banner-content {
			 margin-bottom: 0rem; !important
   			 margin-top: 0;
}

        /* Escondemos la imagen móvil en escritorio y viceversa */
        .img-escritorio {
            display: block;
        }

        .img-movil {
            display: none;
        }

        /* En pantallas pequeñas (móviles), mostramos la imagen móvil y escondemos la de escritorio */
        @media (max-width: 768px) {
            .img-escritorio {
                display: none;
            }

            .img-movil {
                display: block;
            }
			
		.banner-content {
			margin-bottom: 0rem; !important
   			 margin-top: 0;
}
